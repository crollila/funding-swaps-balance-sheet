name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,crosscheck]"
      - name: Lint
        run: ruff check src tests
      - name: Keep the committed headline numbers for comparison
        run: cp results/headline.json /tmp/committed_headline.json
      - name: Full pipeline (curves, book, optimizer, gate, stress, figures, docs)
        run: python -m fsbs
      - name: Headline numbers reproduce
        run: python -m fsbs.check /tmp/committed_headline.json results/headline.json
      - name: Tests (incl. QuantLib cross-check)
        run: python -m pytest -rs
